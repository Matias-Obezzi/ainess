    <!--
      No `interactive-widget=resizes-content` here: resizing the layout on every keyboard toggle
      moves the thread off its bottom anchor (the scroll event that follows reads as "the user
      scrolled up"), so the conversation jumped around while a task was streaming.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>ainess remoto</title>
    <script>
      // The theme is the `.dark` class on <html> (see src/index.css). On the phone there is no
      // setting to flip it, so it follows the system.
      (function () {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function () { document.documentElement.classList.toggle("dark", mq.matches); };
        apply();
        mq.addEventListener("change", apply);
      })();
    </script>
