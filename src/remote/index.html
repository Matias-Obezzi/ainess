<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>ainess remoto</title>
    <script>
      // The theme is the `.dark` class on <html> (see src/index.css). On the phone there is no
      // setting to flip it, so it follows the system.
      (function () {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function () { document.documentElement.classList.toggle("dark", mq.matches); };
        apply();
        mq.addEventListener("change", apply);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
