<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>AIS remoto</title>
<style>
  :root { color-scheme: dark; --bg:#111; --card:#1b1b1b; --border:#2c2c2c; --fg:#f2f2f2; --muted:#9a9a9a; --accent:#4f8cff; --ok:#22c55e; --warn:#eab308; --bad:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; padding-bottom: 150px; }
  header { position: sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--border); padding: 10px 12px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:16px; margin:0; }
  header select { margin-left:auto; max-width:50%; background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:8px; padding:6px 8px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--bad); flex:none; }
  .dot.on { background:var(--ok); }
  main { padding: 12px; display:flex; flex-direction:column; gap:14px; }
  section h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 12px; }
  .approval { border-color: var(--warn); }
  .approval .who { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .approval .task { white-space:pre-wrap; margin-bottom:8px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button { background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:10px; padding:9px 12px; font-size:14px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.ok { background:var(--ok); border-color:var(--ok); color:#000; }
  button.bad { background:var(--bad); border-color:var(--bad); color:#fff; }
  button:disabled { opacity:.5; }
  input, textarea, select { background:#151515; color:var(--fg); border:1px solid var(--border); border-radius:10px; padding:9px 10px; font-size:15px; width:100%; }
  .agents { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:8px; }
  .agent { border-left:4px solid var(--accent); }
  .agent .name { font-weight:600; }
  .agent .status { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .agent .task { font-size:12px; color:var(--muted); margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .st { width:8px; height:8px; border-radius:50%; background:#666; }
  .st.working { background:var(--ok); animation: pulse 1s infinite; }
  .st.waiting { background:var(--warn); }
  .st.error { background:var(--bad); }
  .st.stopped { background:#f97316; }
  @keyframes pulse { 50% { opacity:.3; } }
  .feed { display:flex; flex-direction:column; gap:6px; }
  .msg { font-size:13px; border-left:3px solid var(--border); padding:4px 8px; }
  .msg .meta { color:var(--muted); font-size:11px; }
  .msg.delegation { border-color: var(--warn); }
  .msg.result { border-color: var(--ok); }
  .msg.error, .msg.stderr { border-color: var(--bad); }
  .msg.user, .msg.instruction { border-color: var(--accent); }
  .msg .text { white-space:pre-wrap; word-break:break-word; max-height:6em; overflow:hidden; }
  .msg.open .text { max-height:none; }
  .composer { position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--border); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px; }
  .composer textarea { min-height:56px; resize:none; }
  .composer .row select { flex:1; }
  .empty { color:var(--muted); font-size:13px; }
  #toast { position:fixed; top:56px; left:50%; transform:translateX(-50%); background:#000; color:#fff; border:1px solid var(--border); padding:8px 14px; border-radius:20px; font-size:13px; display:none; z-index:10; }
</style>
</head>
<body>
<header>
  <span id="dot" class="dot"></span>
  <h1>AIS</h1>
  <select id="project"></select>
</header>
<div id="toast"></div>
<main>
  <section id="approvals-section" hidden>
    <h2>Aprobaciones pendientes</h2>
    <div id="approvals" class="feed"></div>
  </section>
  <section>
    <h2>Agentes</h2>
    <div id="agents" class="agents"></div>
  </section>
  <section>
    <h2>Comunicación</h2>
    <div id="feed" class="feed"></div>
  </section>
</main>
<div class="composer">
  <textarea id="text" placeholder="Escribí un prompt o una instrucción…"></textarea>
  <div class="row">
    <select id="target"></select>
    <button id="send" class="primary">Enviar</button>
    <button id="stop" class="bad">Detener</button>
  </div>
</div>
<script>
(() => {
  const qs = new URLSearchParams(location.search);
  let token = qs.get("token");
  if (token) { try { localStorage.setItem("ais-token", token); } catch {} history.replaceState(null, "", location.pathname); }
  else { try { token = localStorage.getItem("ais-token"); } catch {} }
  const $ = (id) => document.getElementById(id);
  let snap = null;
  let projectId = null;
  try { projectId = localStorage.getItem("ais-project"); } catch {}
  const openMsgs = new Set();

  const toast = (t) => { const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", 2500); };
  const api = async (path, body) => {
    const res = await fetch(path, { method: body ? "POST" : "GET", headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    const json = await res.json().catch(() => ({}));
    if (!res.ok || json.error) throw new Error(json.error || ("HTTP " + res.status));
    return json;
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const agentName = (id) => id === "user" ? "Vos" : id === "system" ? "Sistema" : (snap.agents.find(a => a.id === id)?.name || id);
  const agentColor = (id) => snap.agents.find(a => a.id === id)?.color || "#4f8cff";
  const statusLabel = { idle: "inactivo", working: "trabajando", waiting: "esperando a sus agentes", stopped: "detenido", error: "error" };
  const time = (ts) => new Date(ts).toLocaleTimeString("es-AR", { hour12: false });

  function render() {
    if (!snap) return;
    // Projects
    const sel = $("project");
    if (!snap.projects.find(p => p.id === projectId)) projectId = snap.projects[0]?.id || null;
    sel.innerHTML = snap.projects.map(p => `<option value="${p.id}" ${p.id === projectId ? "selected" : ""}>${esc(p.name)}${p.running ? " · " + p.running + " en curso" : ""}</option>`).join("") || "<option>Sin proyectos</option>";
    // Approvals
    const approvals = snap.approvals.filter(a => a.projectId === projectId);
    $("approvals-section").hidden = approvals.length === 0;
    $("approvals").innerHTML = approvals.map(a => `
      <div class="card approval" data-id="${a.id}">
        <div class="who">${esc(agentName(a.agentId))} → ${esc(agentName(a.toAgentId))} · ${time(a.createdAt)}</div>
        <div class="task">${esc(a.payload.prompt)}</div>
        <input placeholder="Nota opcional" data-note>
        <div class="row" style="margin-top:8px">
          <button class="ok" data-approve>Aprobar</button>
          <button class="bad" data-reject>Rechazar</button>
        </div>
      </div>`).join("");
    // Agents
    const rt = snap.runtime[projectId] || {};
    $("agents").innerHTML = snap.agents.map(a => {
      const r = rt[a.id] || { status: "idle" };
      return `<div class="card agent" style="border-left-color:${esc(a.color || "#4f8cff")}">
        <div class="name">${esc(a.name)}</div>
        <div class="status"><span class="st ${r.status}"></span>${statusLabel[r.status] || r.status}</div>
        ${r.currentTask ? `<div class="task">${esc(r.currentTask)}</div>` : ""}
        ${r.status === "working" || r.status === "waiting" ? `<button data-stop-agent="${a.id}" style="margin-top:6px;font-size:12px;padding:5px 8px">Detener</button>` : ""}
      </div>`;
    }).join("") || `<div class="empty">Sin agentes configurados.</div>`;
    // Feed
    const msgs = snap.messages.filter(m => m.projectId === projectId).slice(-60);
    $("feed").innerHTML = msgs.map(m => `
      <div class="msg ${m.kind} ${openMsgs.has(m.id) ? "open" : ""}" data-msg="${m.id}">
        <div class="meta"><span style="color:${esc(agentColor(m.fromAgentId))}">${esc(agentName(m.fromAgentId))}</span>${m.toAgentId ? " → " + esc(agentName(m.toAgentId)) : ""} · ${m.kind} · ${time(m.ts)}</div>
        <div class="text">${esc(m.text)}</div>
      </div>`).reverse().join("") || `<div class="empty">Sin mensajes todavía.</div>`;
    // Target selector
    const roots = snap.agents.filter(a => a.parentId === null);
    const planner = roots.find(a => a.role === "planner") || roots[0];
    const current = $("target").value;
    $("target").innerHTML = snap.agents.map(a => `<option value="${a.id}" ${(current ? current === a.id : planner && planner.id === a.id) ? "selected" : ""}>${esc(a.name)}${a.id === planner?.id ? " (planificador)" : ""}</option>`).join("");
    const active = snap.projects.find(p => p.id === projectId)?.activeTaskRunId;
    $("send").textContent = active ? "Indicar" : "Enviar";
  }

  let es = null, retry = 1000;
  function connect() {
    if (es) es.close();
    es = new EventSource("/api/events?token=" + encodeURIComponent(token || ""));
    es.addEventListener("state", (e) => { snap = JSON.parse(e.data); $("dot").classList.add("on"); retry = 1000; render(); });
    es.onerror = () => { $("dot").classList.remove("on"); es.close(); setTimeout(connect, retry); retry = Math.min(retry * 2, 15000); };
  }

  $("project").addEventListener("change", (e) => { projectId = e.target.value; try { localStorage.setItem("ais-project", projectId); } catch {} render(); });
  $("send").addEventListener("click", async () => {
    const text = $("text").value.trim();
    if (!text || !projectId) return;
    const agentId = $("target").value;
    const active = snap.projects.find(p => p.id === projectId)?.activeTaskRunId;
    try {
      await api(active ? "/api/instruct" : "/api/prompt", { projectId, agentId, text });
      $("text").value = "";
      toast(active ? "Instrucción enviada" : "Prompt enviado");
    } catch (e) { toast("Error: " + e.message); }
  });
  $("stop").addEventListener("click", async () => {
    if (!projectId) return;
    try { await api("/api/stop", { projectId }); toast("Detenido"); } catch (e) { toast("Error: " + e.message); }
  });
  document.addEventListener("click", async (e) => {
    const t = e.target;
    if (t.dataset.stopAgent) { try { await api("/api/stop", { projectId, agentId: t.dataset.stopAgent }); toast("Agente detenido"); } catch (err) { toast("Error: " + err.message); } return; }
    const card = t.closest("[data-id]");
    if (card && (t.hasAttribute("data-approve") || t.hasAttribute("data-reject"))) {
      const decision = t.hasAttribute("data-approve") ? "approve" : "reject";
      const note = card.querySelector("[data-note]").value.trim() || undefined;
      t.disabled = true;
      try { await api("/api/approve", { approvalId: card.dataset.id, decision, note }); toast(decision === "approve" ? "Aprobado" : "Rechazado"); }
      catch (err) { toast("Error: " + err.message); t.disabled = false; }
      return;
    }
    const msg = t.closest("[data-msg]");
    if (msg) { const id = msg.dataset.msg; openMsgs.has(id) ? openMsgs.delete(id) : openMsgs.add(id); msg.classList.toggle("open"); }
  });

  if (!token) { document.body.innerHTML = "<main><div class='card'>Falta el token. Abrí la URL con <code>?token=…</code> desde la app o el CLI (<code>ais remote url</code>).</div></main>"; return; }
  connect();
})();
</script>
</body>
</html>
