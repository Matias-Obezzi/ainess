name: Report a problem
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. The steps and the version are usually enough to reproduce it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Tell it in your own words.
      placeholder: Turning the tunnel on leaves the app saying "creating the tunnel" forever.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: The steps, one by one.
      placeholder: |
        1. Open Settings → Remote
        2. Turn on access over the local network
        3. Turn on the public tunnel
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ainess version
      description: It is in Settings → About.
      placeholder: 0.3.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: checkboxes
    id: agents
    attributes:
      label: Agents involved
      description: Tick the ones in play, if the problem has to do with any of them.
      options:
        - label: Claude Code
        - label: Antigravity
        - label: GitHub Copilot
        - label: Another one / none in particular

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Settings → About → Copy diagnostic gives you the version and the last lines of the log.
        Paste it here as it is.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: no-secrets
    attributes:
      label: Before you send it
      options:
        - label: I checked that what I am pasting carries no tokens, authtokens or API keys.
          required: true
