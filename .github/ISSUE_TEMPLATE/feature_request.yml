name: Suggest an improvement
description: Something you would like the app to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you would want to do and why. The "what for" helps more than the "how".

  - type: textarea
    id: what
    attributes:
      label: What you would like to be able to do
      placeholder: See how much quota each agent has left without opening the settings.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What problem it solves for you
      description: What you are trying to get done, and what makes it hard today.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Part of the app
      options:
        - Orchestration and delegation
        - Chat
        - Agent hierarchy
        - Terminals
        - Remote access and phone
        - Settings
        - Another one / not sure
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How you picture it
      description: Optional. If you already have an idea of the interface or the flow, tell us.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What you are doing in the meantime
      description: Optional. Workarounds or other tools you are using for this today.
    validations:
      required: false
