name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check that the three versions match
        run: npm run release:check

      - name: Read the version from tauri.conf.json
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      # Merging to main without bumping the version must not try to re-create an existing tag.
      - name: Skip when the tag already exists
        id: tag
        shell: bash
        run: |
          if git ls-remote --tags origin "v${{ steps.version.outputs.value }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "El tag v${{ steps.version.outputs.value }} ya existe: no se publica nada."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish the release
        if: steps.tag.outputs.exists == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: ainess v__VERSION__
          releaseBody: Ver los cambios en el historial de commits.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis
