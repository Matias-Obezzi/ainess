name: CI

on:
  pull_request:
  # Only `dev`: a branch with a pull request open already gets this run from the line above, and
  # `main` has `release.yml`, which runs the same checks before it publishes anything.
  push:
    branches: [dev]

# A push to `dev` with its pull request open fires this twice, once per event. Same branch, same
# group: the newer run cancels the older one and only one of the two survives.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build the web bundle
        run: npm run build

      - name: Build the CLI
        run: npm run build:cli

      - name: Check that the three versions match
        run: npm run release:check

      - name: cargo check
        working-directory: src-tauri
        run: cargo check
