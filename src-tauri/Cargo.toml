[package]
name = "ainess"
version = "0.16.0"
description = "Orquestador local de agentes de IA"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ainess_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "7"
dirs = "6"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13.4", features = ["json"] }
# LAN remote access (src/remote.rs)
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
local-ip-address = "0.6"
# Integrated terminals (src/pty.rs): ConPTY on Windows, forkpty elsewhere
portable-pty = "0.9"
notify = "8.2.0"
flate2 = "1.1.10"
# What the user attaches in the composer travels base64-encoded through the webview.
base64 = "0.22"
tauri-plugin-single-instance = "2.4.4"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri-plugin-window-state = "2"


# Just enough of the Win32 API to take one console for the app and hide it, so that nothing an
# agent starts underneath us ever asks Windows for a visible one of its own (see src/console.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
